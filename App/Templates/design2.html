<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance - Page 2</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" 
          crossorigin="anonymous">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1551434678-e076c223a692?w=1600&q=80') no-repeat center center/cover;
            background-size: cover;
        }

        .container-box {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
            width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            color: black;
            font-weight: bold;
            padding: 10px;
        }

        p {
            color: #28a745;
            text-align: center;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-check {
            display: flex;
            flex-wrap: wrap;
        }

        .form-check label {
            margin-right: 15px;
        }

        .btn-submit {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        .flex-div {
            display: flex;
        }

        .flex-div label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container-box">
    <h1>Skills and Quality</h1>
    <p>Enter Quality and Skills of Employee</p>

    <form method="POST" action="{{ url_for('page2') }}">

        <div class="form-group">
            <label>Code Quality:</label>
            <div class="flex-div">
                <div >
                    <input type="radio" name="Code quality" value="excellent" id="CQ excellent">
                    <label for="CQ excellent">Excellent</label>
                </div>
                <div>
                    <input type="radio" name="Code quality" value="good" id="CQ good">
                    <label for="CQ good">Good</label>
                </div>
                <div>
                    <input type="radio" name="Code quality" value="poor" id="CQ poor">
                    <label for="CQ poor">Poor</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Quality of Work:</label>
            <div class="flex-div">
                <div>
                    <input type="radio" name="Quality of Work" value="excellent" id="QOW Excellent">
                    <label for="QOW Excellent">Excellent</label>
                </div>
                <div>
                    <input type="radio" name="Quality of Work" value="good" id="QOW Good">
                    <label for="QOW Good">Good</label>
                </div>
                <div>
                    <input type="radio" name="Quality of Work" value="poor" id="QOW Poor">
                    <label for="QOW Poor">Poor</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Time Management:</label>
            <div class="flex-div">
                <div>
                    <input type="radio" name="Time Management" value="excellent" id="TM excellent">
                    <label for="TM excellent">Excellent</label>
                </div>
                <div>
                    <input type="radio" name="Time Management" value="good" id="TM good">
                    <label for="TM good">Good</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Workload:</label>
            <div class="flex-div">
                <div>
                    <input type="radio" name="Workload" value="high" id="WL high">
                    <label for="WL high">High</label>
                </div>
                <div>
                    <input type="radio" name="Workload" value="medium" id="WL medium">
                    <label for="WL medium">Medium</label>
                </div>
                <div>
                    <input type="radio" name="Workload" value="low" id="WL low">
                    <label for="WL low">Low</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Debugging Skills:</label>
            <div class="flex-div">
                <div>
                    <input type="radio" name="Debugging Skills" value="excellent" id="Ds Excellent">
                    <label for="Ds Excellent">Excellent</label>
                </div>
                <div>
                    <input type="radio" name="Debugging Skills" value="good" id="DS Good">
                    <label for="DS Good">Good</label>
                </div>
                <div>
                    <input type="radio" name="Debugging Skills" value="poor" id="DS Poor">
                    <label for="DS Poor">Poor</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="Technical Skills">Technical Skills:</label>
            <div class="form-check d-flex flex-wrap">
                {% for skill in skills %}
                    <div class="me-3">
                        <input type="checkbox" id="{{ skill }}" name="Technical Skills" value="{{ skill }}">
                        <label for="{{ skill }}">{{ skill }}</label>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="btn-group">
            <a href="/"><button type="button" class="btn btn-secondary">← Previous</button></a>
            <button type="submit" class="btn btn-primary">Next →</button>
        </div>

    </form>
</div>

</body>
</html>
