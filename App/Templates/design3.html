<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Page</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" 
          crossorigin="anonymous">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1551434678-e076c223a692?w=1600&q=80') no-repeat center center/cover;
            background-size: cover;
        }

        .container-box {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
            width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            color: black;
            font-weight: bold;
            padding: 10px;
        }

        p {
            color: #28a745;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }

        input[type="number"], input[type="radio"] {
            margin-top: 5px;
            padding: 10px;
            font-size: 1rem;
            width: 100%;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background: #f8f9fa;
        }

        .btn-submit {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        .flex-div {
            display: flex;
            justify-content: space-between;
        }

        .flex-div label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }

        .flex-div-margin {
            margin-right: 60px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container-box">
    <h1>Enter Employee Evaluation</h1>
    <p>Enter the Details Below to Predict Employee Performance</p>

    <form method="POST" action="{{ url_for('page3') }}">

        <div class="form-group">
            <label for="Project_Completion_rate">Project Completion Rate (in %):</label>
            <input type="number" id="Project_Completion_rate" name="Project_Completion_rate" required min="1" max="100" placeholder="Enter Numeric Value">
        </div>

        <div class="form-group">
            <label>Learning Growth:</label>
            <div class="flex-div">
                <div>
                    <input type="radio" name="Learning_Growth" id="LG yes" value="yes">
                    <label for="LG yes">Yes</label>
                </div>
                <div>
                    <input type="radio" name="Learning_Growth" id="LG no" value="no">
                    <label for="LG no">No</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="Peer_Feedback">Peer Feedback (1 to 10):</label>
            <input type="number" id="Peer_Feedback" name="Peer_Feedback" min="1" max="10" required placeholder="Enter Feedback" />
        </div>

        <div class="btn-group">
            <a href="/"><button type="button" class="btn btn-secondary">← Previous</button></a>
            <button type="submit" class="btn btn-primary">Predict</button>
        </div>

        <div>
            <p style="color:red; text-align:center;">Result: {{ answer }}</p>
        </div>

    </form>
</div>

</body>
</html>
