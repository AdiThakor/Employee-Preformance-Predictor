<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance Prediction</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" 
          crossorigin="anonymous">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('https://source.unsplash.com/1600x900/?office,workspace') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
        }
        .container-box {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
            width: 450px;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            color: black;
            font-weight: bold;
        }
        .form-group label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background: #f8f9fa;
        }
        .btn-submit {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container-box">
    <h1>Employee Performance Prediction</h1>
    <p style="color:#28a745; text-align:center;"> Enter Employee Data </p>

    <form method="POST" action="{{ url_for('page1') }}">

        <!-- Education Level -->
        <div class="form-group">
            <label for="Education_level">Education Level:</label>
            <select id="Education_level" name="Education_level" required>
                <option value="">--- Select Education Level ---</option>
                <option value="bachelors">Bachelor's</option>
                <option value="masters">Master's</option>
                <option value="phd">PhD</option>
            </select>
        </div>

        <br>

        <!-- Department -->
        <div class="form-group">
            <label for="Department">Department:</label>
            <select id="Department" name="Department" required>
                <option value="">--- Select Department ---</option>
                <option value="python & ml">Python & ML</option>
                <option value="database">Database</option>
                <option value="frontend">Frontend</option>
                <option value="mobile">Mobile</option>
                <option value="devops">DevOps</option>
                <option value=".net">.Net</option>
            </select>
        </div>

        <br>

        <!-- Job Tenure -->
        <div class="form-group">
            <label for="Job_tenure">Job Tenure:</label>
            <input type="number" id="Job_tenure" name="Job_tenure" required placeholder="Enter years of experience">
        </div>

        <br>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Next</button>

    </form>
</div>

</body>
</html>
