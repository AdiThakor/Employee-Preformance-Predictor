<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Background with Overlay */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1551434678-e076c223a692?w=1600&q=80') no-repeat center center/cover;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* Dark Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 1;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Title */
        .title {
            font-size: 1.5rem;
            text-align: center;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        /* Form Labels */
        label {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 5px;
            color: #222;
        }

        /* Form Fields */
        select, input {
            width: 100%;
            height: 42px;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            color: #333;
            outline: none;
            transition: 0.3s ease-in-out;
        }

        select:focus, input:focus {
            border-color: #007bff;
            background: #fff;
        }

        /* Fix Spacing Issue */
        .form-group {
            margin-bottom: 15px; /* Added spacing between fields */
        }

        /* Submit Button */
        .btn-primary {
            width: 100%;
            height: 48px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease-in-out;
            border: none;
            background: #007bff;
            color: #fff;
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.3);
            margin-top: 20px; /* Ensures spacing from last input */
        }

        .btn-primary:hover {
            background: #0056b3;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.5);
        }

    </style>
</head>

<body>

<div class="container">

    <h1 class="title">Employee Performance Evaluation</h1>

    <form method="POST" action="{{ url_for('page2') }}">

        <div class="form-group">
            <label for="Education_level">Education Level</label>
            <select id="Education_level" name="Education_level" required>
                <option value="">Select Education Level</option>
                <option value="bachelors">Bachelor's</option>
                <option value="masters">Master's</option>
                <option value="phd">PhD</option>
            </select>
        </div>

        <div class="form-group">
            <label for="Department">Department</label>
            <select id="Department" name="Department" required>
                <option value="">Select Department</option>
                <option value="python & ml">Python & ML</option>
                <option value="database">Database</option>
                <option value="frontend">Frontend</option>
                <option value="mobile">Mobile</option>
                <option value="devops">DevOps</option>
                <option value=".net">.Net</option>
            </select>
        </div>

        <div class="form-group">
            <label for="Job_tenure">Job Tenure (Years)</label>
            <input type="number" id="Job_tenure" name="Job_tenure" placeholder="Enter years of experience" required>
        </div>

        <button type="submit" class="btn-primary">Next</button>
    </form>
</div>

</body>
</html>
